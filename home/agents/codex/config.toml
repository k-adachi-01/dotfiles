# Leave model selection to Codex defaults; do not pin a model version.
model_reasoning_effort = "medium"
personality = "pragmatic"
approval_policy = "on-request"
approvals_reviewer = "auto_review"
sandbox_mode = "workspace-write"

[notice]
hide_rate_limit_model_nudge = true
fast_default_opt_out = true

[tui]
screen_reader_mode = true
status_line = ["model-with-reasoning", "current-dir", "five-hour-limit", "weekly-limit", "context-remaining"]
status_line_use_colors = true

[plugins."google-calendar@openai-curated"]
enabled = true

[plugins."gmail@openai-curated"]
enabled = true

[plugins."google-drive@openai-curated"]
enabled = true

[plugins."documents@openai-primary-runtime"]
enabled = true

[plugins."pdf@openai-primary-runtime"]
enabled = true

[plugins."spreadsheets@openai-primary-runtime"]
enabled = true

[plugins."presentations@openai-primary-runtime"]
enabled = true

[plugins."chrome@openai-bundled"]
enabled = true

[plugins."browser@openai-bundled"]
enabled = true

[plugins."template-creator@openai-primary-runtime"]
enabled = true

[features]
js_repl = false
experimental_use_rmcp_client = true

[desktop]
followUpQueueMode = "queue"

[mcp_servers.finance_vault]
url = "https://finance-vault-mcp.adachi-mte-b516e5.workers.dev/mcp"
enabled_tools = ["get_identity", "list_transactions", "get_transaction", "update_transaction", "create_transaction"]
