name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A full `darwin-rebuild build` needs the private `agent-skills` flake input
# (see docs/management-policy.md section 5), which this public repo's CI
# has no credentials for. This workflow is therefore lint + secret-scan
# only; `nix build`/`darwin-rebuild build` remain a required local step
# before every push (see AGENTS.md).
jobs:
  lint:
    name: alejandra / statix / deadnix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Select locked nixpkgs
        run: echo "NIXPKGS_REF=github:NixOS/nixpkgs/$(jq -r ' .nodes[.nodes.root.inputs.nixpkgs].locked.rev' flake.lock)" >> "$GITHUB_ENV"
      - name: alejandra --check
        run: nix run "$NIXPKGS_REF#alejandra" -- --check .
      - name: statix check
        run: nix run "$NIXPKGS_REF#statix" -- check .
      - name: deadnix
        run: nix run "$NIXPKGS_REF#deadnix" -- --fail .

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v23
      - name: Select locked nixpkgs
        run: echo "NIXPKGS_REF=github:NixOS/nixpkgs/$(jq -r ' .nodes[.nodes.root.inputs.nixpkgs].locked.rev' flake.lock)" >> "$GITHUB_ENV"
      - name: gitleaks detect
        run: nix run "$NIXPKGS_REF#gitleaks" -- detect --source . --config .gitleaks.toml --redact -v
